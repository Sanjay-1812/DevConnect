<link rel="stylesheet" href="styles.css">
<body>
<h2 id="name"></h2>
<p id="skill"></p>
<p id="bio"></p>
<button onclick="connect()">Connect</button>
<script>
var names=["Arjun","Meera","Rahul","Sneha"];
var skills=[
"Frontend Developer",
"Backend Developer",
"AI Engineer",
"Full Stack Developer"
];
var bios=[
"Arjun is a frontend developer specializing in building responsive and visually appealing user interfaces. He has strong knowledge of HTML, CSS, and JavaScript. He focuses on creating smooth user experiences and modern web designs. He enjoys working on UI/UX improvements and interactive features.",

"Meera is a backend developer experienced in handling server-side logic and database management. She builds scalable systems and ensures efficient data flow in applications. Her expertise includes APIs and backend architecture. She plays a key role in making applications reliable and secure.",

"Rahul is an AI engineer who works on machine learning models and intelligent systems. He is passionate about data analysis and automation. He applies AI techniques to solve real-world problems. His work focuses on improving system intelligence and decision-making capabilities.",

"Sneha is a full stack developer who works on both frontend and backend technologies. She can design complete applications from scratch. She ensures smooth integration between UI and server logic. Her versatility makes her a strong contributor to any development team."
];
var i=localStorage.getItem("dev");

document.getElementById("name").innerHTML=names[i];
document.getElementById("skill").innerHTML=skills[i];
document.getElementById("bio").innerHTML=bios[i];

function connect(){
alert("Connection request sent");
}
</script>
</body>
